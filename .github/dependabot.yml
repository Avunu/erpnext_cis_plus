# frappe-nix:managed — generated by frappe-nix (`frappe-init --sync`); edit only inside the frappe-nix:local region.
# Every entry targets develop and commits as chore(deps)/chore(deps-dev), so no bump cuts a release.
# deps.yml decides what merges automatically.
version: 2
updates:
  # One entry for /, which is also the entry a docs tool scaffolds. Separate groups,
  # so a docs or pilot bump never holds up the rest.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    # frappe-nix's reusable workflows move only through `frappe-nix repo rollout` and `frappe-init --sync`.
    ignore:
      - dependency-name: Avunu/frappe-nix
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    groups:
      toolchain:
        patterns: [oxlint, oxfmt, typescript, frappe-types, "@types/node", "stylelint*"]
        update-types: [minor, patch]
      runtime:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /tools
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    groups:
      tools:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pre-commit
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    groups:
      hooks:
        patterns: ["*"]
        exclude-patterns: ["*agritheory/test_utils*"]
      test-utils:
        patterns: ["*agritheory/test_utils*"]
  - package-ecosystem: nix
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    # frappe-nix and the org profile move only through `frappe-nix repo rollout` (S5, S38): their bump can rewrite
    # workflow files, which GITHUB_TOKEN can't push. Dependabot moves frappe and the siblings, which never touch one.
    ignore:
      - dependency-name: frappe-nix
      - dependency-name: standards-profile
    groups:
      flake-inputs:
        patterns: ["*"]
  # frappe-nix:local-begin updates
  # frappe-nix:local-end updates
