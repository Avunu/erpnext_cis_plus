name: Docs

# Checks the documentation on every pull request that touches it, exactly as the one site
# (https://docs.avunu.net/erpnext-cis-plus/) will build it, links to the other projects included. The work is
# done by the shared workflow of Avunu/site-docs, pinned to a commit: the tool moves with the pin.
# Nothing here can publish: the token is read-only and there is no secret. After a release,
# Avunu/site-docs picks the documentation up by itself.
on:
  pull_request:
    paths:
      - docs/**
      - .github/workflows/docs.yml

permissions: {}

concurrency:
  group: docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs:
    permissions:
      contents: read # checkout
    uses: Avunu/site-docs/.github/workflows/check-docs.yml@28cfe09eae874d7502344872da82ac63612554c4 # 2026-10-25
    with:
      path: erpnext-cis-plus
