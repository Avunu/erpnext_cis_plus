# frappe-nix:managed — generated by frappe-nix (`frappe-init --sync`); do not edit.
# The quality gates (docs: ci.md). One caller job per enabled gate, each named `ci`, so the
# checks are `ci / <gate>` (S3, S39). frappe-nix's reusable workflows move only through
# `frappe-nix repo rollout` or `frappe-init --sync` (S5).
name: ci
on:
  push:
    branches: [develop]
  pull_request:
  schedule:
    # The integration branch, daily: a GITHUB_TOKEN auto-merge raises no push.
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: ci
    permissions:
      contents: read
      pull-requests: read
    uses: Avunu/frappe-nix/.github/workflows/app-lint.yml@c7d9d4b0826f4ab278f5bc72e021fbb351157ef6 # v2.1.0
    with:
      app: erpnext_cis_plus
      integration-branch: develop
      runs-on: '["self-hosted","nixos"]'
    secrets:
      FETCH_TOKEN: ${{ secrets.FRAPPE_NIX_FETCH_TOKEN }}
  typecheck:
    name: ci
    permissions:
      contents: read
      pull-requests: read
    uses: Avunu/frappe-nix/.github/workflows/app-typecheck.yml@c7d9d4b0826f4ab278f5bc72e021fbb351157ef6 # v2.1.0
    with:
      app: erpnext_cis_plus
      integration-branch: develop
      runs-on: '["self-hosted","nixos"]'
    secrets:
      FETCH_TOKEN: ${{ secrets.FRAPPE_NIX_FETCH_TOKEN }}
  test:
    name: ci
    permissions:
      contents: read
      pull-requests: write
    uses: Avunu/frappe-nix/.github/workflows/app-test.yml@c7d9d4b0826f4ab278f5bc72e021fbb351157ef6 # v2.1.0
    with:
      app: erpnext_cis_plus
      integration-branch: develop
      runs-on: '["self-hosted","nixos"]'
      nix-cache: ${{ vars.FRAPPE_NIX_CACHE || '' }}
      test-timeout-minutes: 120
    secrets:
      NIX_CACHE_TOKEN: ${{ secrets.FRAPPE_NIX_CACHE_TOKEN }}
      NIX_CACHE_READ_TOKEN: ${{ secrets.FRAPPE_NIX_CACHE_READ_TOKEN }}
      FETCH_TOKEN: ${{ secrets.FRAPPE_NIX_FETCH_TOKEN }}
  marketplace:
    name: ci
    permissions:
      contents: read
      pull-requests: read
    uses: Avunu/frappe-nix/.github/workflows/app-marketplace.yml@c7d9d4b0826f4ab278f5bc72e021fbb351157ef6 # v2.1.0
    with:
      app: erpnext_cis_plus
      integration-branch: develop
      runs-on: '["self-hosted","nixos"]'
    secrets:
      FETCH_TOKEN: ${{ secrets.FRAPPE_NIX_FETCH_TOKEN }}
