# frappe-nix:managed — generated by frappe-nix (`frappe-init --sync`); do not edit.
# Nightly (docs: ci.md, §4.6): the integration suites, and the reminders that the pinned
# frappe-nix or standards profile is behind. Never a required check.
name: nightly
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  nightly:
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
    uses: Avunu/frappe-nix/.github/workflows/app-nightly.yml@82fc1270769e140e2b1e0caab41717d8fe8c55e2 # v2.4.1
    with:
      app: erpnext_cis_plus
      integration-branch: develop
      runs-on: '["self-hosted","nixos"]'
      nix-cache: ${{ vars.FRAPPE_NIX_CACHE || '' }}
      run-integration: true
      run-shots: true
      run-links: true
      run-duplication: true
      auto-merge: true
      merge-method: squash
      publish: ${{ vars.MARKETPLACE_PUBLISH == 'true' }}
    secrets:
      NIX_CACHE_TOKEN: ${{ secrets.FRAPPE_NIX_CACHE_TOKEN }}
      NIX_CACHE_READ_TOKEN: ${{ secrets.FRAPPE_NIX_CACHE_READ_TOKEN }}
      FETCH_TOKEN: ${{ secrets.FRAPPE_NIX_FETCH_TOKEN }}
      APP_ID: ${{ vars.AVUNU_CI_APP_ID || secrets.AVUNU_CI_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
