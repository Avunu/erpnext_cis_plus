# frappe-nix:managed — generated by frappe-nix (`frappe-init --sync`); do not edit.
# Releases without an App (docs: ci.md, S13): release-please, CI on the release PR, the
# fast-forward of the release branch (develop+version) and, when enabled, the registry PR.
name: release
on:
  push:
    branches: [develop]
  schedule:
    # Auto-merged commits raise no push.
    - cron: "30 5 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    uses: Avunu/frappe-nix/.github/workflows/app-release.yml@237174925cb78b6079d288e4f406ea40f1100265 # v1.4.0
    with:
      app: erpnext_cis_plus
      integration-branch: develop
      runs-on: '["self-hosted","nixos"]'
      release-branch: "version-16"
      publish: ${{ vars.MARKETPLACE_PUBLISH == 'true' }}
      registry-fork: Avunu/marketplace
      pilot-assets: false
    secrets:
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      FETCH_TOKEN: ${{ secrets.FRAPPE_NIX_FETCH_TOKEN }}
