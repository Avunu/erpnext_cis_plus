# frappe-nix:managed — generated by frappe-nix (`frappe-init --sync`); do not edit.
# `ci / pr-policy` (docs: ci.md): the PR's base, title and commits. Its own file, so a retitle
# re-runs only this check (S4).
name: pr-policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pr-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: Avunu/frappe-nix/.github/workflows/app-pr-policy.yml@c7d9d4b0826f4ab278f5bc72e021fbb351157ef6 # v2.1.0
    with:
      app: erpnext_cis_plus
      integration-branch: develop
      runs-on: '["self-hosted","nixos"]'
    secrets:
      FETCH_TOKEN: ${{ secrets.FRAPPE_NIX_FETCH_TOKEN }}
